openapi: 3.0.3
info:
  title: Brokerage Asset API
  description: API for managing customer assets in a brokerage system
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: assets
    description: Operations related to customer assets

paths:
  /api/assets:
    get:
      summary: List assets for a customer
      description: Retrieves all assets owned by a specified customer
      tags:
        - assets
      operationId: listAssets
      parameters:
        - name: customerId
          in: query
          required: true
          description: The unique identifier(username) of the customer
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetResponse'
        404:
          description: Customer not found
          content:
            application/problem+json:
              schema:
                $ref: './common-schema.yaml#/components/schemas/ErrorResponse'
        default:
          description: default error response
          content:
            application/problem+json:
              schema:
                $ref: './common-schema.yaml#/components/schemas/ErrorResponse'

  /api/admin/assets/balance:
    post:
      summary: Set balance for a customer (admin only)
      description: Sets the TRY balance for a specified customer
      tags:
        - assets
      operationId: setBalance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBalanceRequest'
      responses:
        201:
          description: Balance set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        400:
          description: Invalid request parameters
          content:
            application/problem+json:
              schema:
                $ref: './common-schema.yaml#/components/schemas/ErrorResponse'
        403:
          description: Forbidden - Admin privileges required
          content:
            application/problem+json:
              schema:
                $ref: './common-schema.yaml#/components/schemas/ErrorResponse'
        default:
          description: default error response
          content:
            application/problem+json:
              schema:
                $ref: './common-schema.yaml#/components/schemas/ErrorResponse'

components:
  schemas:
    AssetResponse:
      type: object
      required:
        - id
        - customerId
        - assetName
        - size
        - usableSize
      properties:
        id:
          type: string
          description: Unique identifier for the asset
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        customerId:
          type: string
          description: Customer who owns this asset
          example: "customer123"
        assetName:
          type: string
          maxLength: 5
          description: Name of the asset (stock symbol or TRY)
          example: "INGA"
        size:
          type: number
          format: double
          description: Total amount of the asset owned
          example: 100.0
        usableSize:
          type: number
          format: double
          description: Amount of the asset available for trading (not reserved in pending orders)
          example: 75.0

    SetBalanceRequest:
      type: object
      required:
        - customerId
        - balance
      properties:
        customerId:
          type: string
          description: The unique identifier(username) of the customer
          example: "customer123"
        balance:
          type: number
          format: double
          description: The TRY balance to set for the customer
          example: 10000.0
          minimum: 0

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

